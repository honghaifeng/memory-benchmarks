<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <rect width="720" height="520" rx="16" fill="url(#bg2)"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">CLongEval 四类问题</text>

  <!-- Card 1: single-hop -->
  <rect x="40" y="60" width="310" height="200" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <rect x="40" y="60" width="310" height="40" rx="12" fill="#10b981"/>
  <rect x="40" y="84" width="310" height="16" fill="#10b981"/>
  <text x="195" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">single-hop · 单跳</text>
  <text x="195" y="124" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">只需 1 条记忆即可回答</text>
  <rect x="60" y="138" width="270" height="30" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="195" y="158" text-anchor="middle" font-size="11" fill="#166534">记忆：我喜欢喝拿铁 ☕</text>
  <text x="195" y="186" text-anchor="middle" font-size="11.5" fill="#0f766e" font-weight="600">问：我上次说喜欢什么咖啡？</text>
  <text x="195" y="210" text-anchor="middle" font-size="11" fill="#10b981" font-weight="700">→ 直接命中 1 条记忆</text>
  <text x="195" y="244" text-anchor="middle" font-size="10.5" fill="#64748b">占比最高 · DeepSeek 74.9% / Qwen 75.3%</text>

  <!-- Card 2: multi-hop -->
  <rect x="370" y="60" width="310" height="200" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="370" y="60" width="310" height="40" rx="12" fill="#8b5cf6"/>
  <rect x="370" y="84" width="310" height="16" fill="#8b5cf6"/>
  <text x="525" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">multi-hop · 多跳</text>
  <text x="525" y="124" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">组合多条记忆推理</text>
  <rect x="390" y="134" width="270" height="26" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="525" y="152" text-anchor="middle" font-size="11" fill="#5b21b6">记忆①：和小李约在「蓝山咖啡」</text>
  <rect x="390" y="164" width="270" height="26" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="525" y="182" text-anchor="middle" font-size="11" fill="#5b21b6">记忆②：蓝山咖啡离家 3 公里</text>
  <text x="525" y="210" text-anchor="middle" font-size="11.5" fill="#6d28d9" font-weight="600">问：约的咖啡店离我家远吗？</text>
  <text x="525" y="234" text-anchor="middle" font-size="11" fill="#8b5cf6" font-weight="700">→ 需同时命中 ①② 并推理</text>
  <text x="525" y="252" text-anchor="middle" font-size="10.5" fill="#64748b">DeepSeek 91.5% 大幅领先</text>

  <!-- Card 3: temporal -->
  <rect x="40" y="280" width="310" height="200" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="40" y="280" width="310" height="40" rx="12" fill="#f59e0b"/>
  <rect x="40" y="304" width="310" height="16" fill="#f59e0b"/>
  <text x="195" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">temporal · 时间推理</text>
  <text x="195" y="344" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">时间先后 / 日期 / 时长</text>
  <rect x="60" y="354" width="270" height="26" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="195" y="372" text-anchor="middle" font-size="11" fill="#92400e">记忆①：3月5日买了咖啡机</text>
  <rect x="60" y="384" width="270" height="26" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="195" y="402" text-anchor="middle" font-size="11" fill="#92400e">记忆②：3月8日见了小李</text>
  <text x="195" y="430" text-anchor="middle" font-size="11.5" fill="#b45309" font-weight="600">问：买咖啡机在见小李之前吗？</text>
  <text x="195" y="454" text-anchor="middle" font-size="11" fill="#f59e0b" font-weight="700">→ 比较两条记忆的时间戳</text>
  <text x="195" y="472" text-anchor="middle" font-size="10.5" fill="#64748b">DeepSeek 90% / Zhipu 仅 60%</text>

  <!-- Card 4: conversation-understanding -->
  <rect x="370" y="280" width="310" height="200" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="370" y="280" width="310" height="40" rx="12" fill="#0ea5e9"/>
  <rect x="370" y="304" width="310" height="16" fill="#0ea5e9"/>
  <text x="525" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">conversation-understanding · 对话理解</text>
  <text x="525" y="344" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">理解对话上下文（指代/隐含/总结）</text>
  <rect x="390" y="354" width="270" height="26" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text x="525" y="372" text-anchor="middle" font-size="11" fill="#075985">对话：先说要买，后说再等等</text>
  <text x="525" y="402" text-anchor="middle" font-size="11.5" fill="#0369a1" font-weight="600">问：他最后改变主意了吗？</text>
  <text x="525" y="430" text-anchor="middle" font-size="11" fill="#0ea5e9" font-weight="700">→ 需理解整段对话的走向</text>
  <text x="525" y="454" text-anchor="middle" font-size="10.5" fill="#64748b">DeepSeek 89.7% 领先</text>
  <text x="525" y="472" text-anchor="middle" font-size="10.5" fill="#64748b">题量最少（约 39 题）</text>
</svg>
