<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="hotGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="720" height="460" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">top-k 检索：取回最相似的 k 条记忆</text>

  <!-- Question box -->
  <rect x="60" y="62" width="200" height="44" rx="10" fill="#1e293b"/>
  <text x="160" y="80" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">用户提问</text>
  <text x="160" y="97" text-anchor="middle" font-size="11" fill="#cbd5e1">"我上次说喜欢什么咖啡？"</text>

  <!-- Arrow to memory bank -->
  <line x1="260" y1="84" x2="330" y2="84" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>

  <!-- Memory bank (vector DB) -->
  <rect x="330" y="54" width="330" height="60" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="495" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#4338ca">记忆库（向量数据库）</text>
  <text x="495" y="94" text-anchor="middle" font-size="11" fill="#6366f1">按相似度排序全部记忆</text>

  <!-- Arrow down to ranked list -->
  <line x1="495" y1="114" x2="495" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Ranked memories list -->
  <text x="60" y="165" font-size="12" font-weight="600" fill="#475569">按相似度从高到低排序的记忆：</text>

  <!-- Top 10 (hot) -->
  <g>
    <rect x="60" y="178" width="600" height="26" rx="6" fill="url(#hotGrad)" opacity="0.9"/>
    <text x="74" y="196" font-size="11" fill="#fff" font-weight="600">Top 10 — 最相似的 10 条（高相关）</text>
  </g>
  <!-- 11-20 -->
  <g>
    <rect x="60" y="210" width="600" height="26" rx="6" fill="url(#memGrad)" opacity="0.75"/>
    <text x="74" y="228" font-size="11" fill="#fff">Top 20 — 前 20 条（含部分相关）</text>
  </g>
  <!-- 21-50 -->
  <g>
    <rect x="60" y="242" width="600" height="26" rx="6" fill="url(#memGrad)" opacity="0.55"/>
    <text x="74" y="260" font-size="11" fill="#fff">Top 50 — 前 50 条（相关度递减）</text>
  </g>
  <!-- 51-200 -->
  <g>
    <rect x="60" y="274" width="600" height="26" rx="6" fill="url(#memGrad)" opacity="0.38"/>
    <text x="74" y="292" font-size="11" fill="#fff">Top 200 — 前 200 条（大量低相关噪声）</text>
  </g>

  <!-- Arrow to LLM -->
  <line x1="495" y1="300" x2="495" y2="326" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- LLM answer box -->
  <rect x="330" y="326" width="330" height="44" rx="10" fill="#10b981"/>
  <text x="495" y="344" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">LLM 基于这 k 条记忆生成答案</text>
  <text x="495" y="361" text-anchor="middle" font-size="11" fill="#d1fae5">k 越大 → 越可能含相关记忆，但噪声也越多</text>

  <!-- Insight card -->
  <rect x="60" y="390" width="600" height="54" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="76" y="412" font-size="12" font-weight="600" fill="#c2410c">如何解读测评数字：</text>
  <text x="76" y="432" font-size="11.5" fill="#9a3412">top_10 高 → 检索排序好；top_10 低但 top_200 高 → 相关记忆排太后，检索需优化</text>
</svg>
